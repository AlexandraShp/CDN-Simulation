[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-cdn-saif-workspace"
version = "0.1.0"
description = "Saif's modules for the Mini CDN routing simulation"
requires-python = ">=3.10"
dependencies = [
    "simpy>=4.1,<5",
    "pandas>=2.2,<4",
    "plotly>=5.20,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
dashboard = ["streamlit>=1.40,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["minicdn*"]
